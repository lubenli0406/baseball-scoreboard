<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>棒球守備位置配置表</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    user-select:none;overflow:hidden;
    touch-action:none;
    width:100%; height:100%;
  }

  #viewport{
    position:fixed; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 4 / 3));
    height:min(100vh, calc(100vw * 3 / 4));
    aspect-ratio:4/3;
    overflow:hidden;
    background:#000;
    touch-action:none;
    container-type:size;
  }

  #app{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:10;
    touch-action:none;
  }

  #field{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    z-index:5;
    pointer-events:none;
  }

  .player{
    position:absolute;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:clamp(16px, 2.73cqw, 64px);
    font-weight:900;
    letter-spacing:.04em;
    -webkit-text-stroke:.2em #000;
    paint-order:stroke fill;
    text-shadow:0 2px 4px rgba(0,0,0,.8);
    white-space:nowrap;
    z-index:25;
    pointer-events:auto;
    cursor:grab;
    touch-action:none;
  }
  .player.dragging{ cursor:grabbing; }

  #boardInfo{
    position:absolute;
    left:50%; top:15.5%;
    transform:translate(-50%,-50%);
    width:42cqw;
    text-align:center;
    color:#fff;
    font-weight:900;
    z-index:20;
    pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.8);
  }
  #boardInfo > div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #boardTitle{ font-size:3cqw; color:#ffd43b; margin-bottom:.5cqw; }
  #boardTeams{ font-size:3.6cqw; }
  #boardTeams .vs{ color:#ffd43b; margin:0 .6em; font-size:.8em; }
</style>
</head>

<body>
<div id="viewport">
  <div id="stage">
    <div id="app">
      <img id="field" src="tw1.png" alt="field">
      <div id="boardInfo">
        <div id="boardTitle"></div>
        <div id="boardTeams"></div>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "scoreboard_16x9_worldcup_zh_v1";

const labelAnchors = {
  LF:{x:13.323,y:42.505}, CF:{x:50.000,y:39.000}, RF:{x:85.880,y:42.505},
  "3B":{x:24.133,y:61.607}, SS:{x:36.639,y:55.300}, "2B":{x:62.476,y:55.163}, "1B":{x:74.906,y:61.698},
  C:{x:69.377,y:82.549}, P:{x:50.000,y:72.000}
};
const NAME_DOWN = 6.0, NAME_UP = -6.0;
const nameOffsets = { "3B":{x:22.667,y:69.5}, SS:{x:37.333,y:61.8}, "2B":{x:60.0,y:61.5}, "1B":{x:76.667,y:69.5} };

const posMap = {
  "投手":"P","捕手":"C","一壘":"1B","二壘":"2B","三壘":"3B","游擊":"SS",
  "左外野":"LF","中外野":"CF","右外野":"RF",
  "P":"P","C":"C","1B":"1B","2B":"2B","3B":"3B","SS":"SS","LF":"LF","CF":"CF","RF":"RF"
};

const defaultState = {
  gameTitle: "棒球賽",
  team1Name: "復旦高中",
  team2Name: "復旦高中",
  team1Pitcher: "林O豪",
  team1Roster: [
    { order: "1", name: "林O豪", pos: "中外野" },
    { order: "2", name: "張O翔", pos: "游擊" },
    { order: "3", name: "李O恩", pos: "一壘" },
    { order: "4", name: "陳O宇", pos: "指定打擊" },
    { order: "5", name: "黃O宇", pos: "三壘" },
    { order: "6", name: "吳O翰", pos: "左外野" },
    { order: "7", name: "邱O宏", pos: "右外野" },
    { order: "8", name: "趙O安", pos: "二壘" },
    { order: "9", name: "周O傑", pos: "捕手" }
  ]
};
let state = { ...defaultState };

const stage = document.getElementById("stage");
const app = document.getElementById("app");

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* ===== 名單同步（與 order.html / tactical.html 同一份資料） ===== */
function loadLocal(){
  try{
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(parsed && typeof parsed === "object") state = { ...defaultState, ...parsed };
  }catch(_){}
}

function initFirebase(){
  if(!window.firebase) return;
  try{
    if(!firebase.apps || !firebase.apps.length){
      firebase.initializeApp({
        apiKey: "AIzaSyDSmrVOB-fkVZ2gGpW1i-T0kTutbt1nkNc",
        authDomain: "baseball-scoreboard-2e8e1.firebaseapp.com",
        databaseURL: "https://baseball-scoreboard-2e8e1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "baseball-scoreboard-2e8e1",
        storageBucket: "baseball-scoreboard-2e8e1.firebasestorage.app",
        messagingSenderId: "705407067271",
        appId: "1:705407067271:web:038af55cf9a2d5ee7fc422"
      });
    }
    firebase.database().ref("scoreboard/state").on("value", snap=>{
      const remote = snap.val();
      if(remote && typeof remote === "object"){
        state = { ...defaultState, ...remote };
        render();
      }
    });
  }catch(_){}
}

window.addEventListener("storage", (e)=>{
  if(e.key === STORAGE_KEY){ loadLocal(); render(); }
});

/* ===== 拖曳位置記憶 ===== */
const POS_STORE_PREFIX = "bsDefPos.v2.sync43";
function posKey(pos){ return `${POS_STORE_PREFIX}.${pos}`; }
function loadPos(pos){
  try{
    const obj = JSON.parse(localStorage.getItem(posKey(pos)));
    if(obj && typeof obj.x === "number" && typeof obj.y === "number"){
      return {x: clamp(obj.x,0,100), y: clamp(obj.y,0,100)};
    }
  }catch(_){}
  return null;
}
function savePos(pos,x,y){
  try{ localStorage.setItem(posKey(pos), JSON.stringify({x:clamp(x,0,100), y:clamp(y,0,100)})); }catch(_){}
}

function bindDrag(el, pos){
  let dragging = false;
  function toPct(cx,cy){
    const r = stage.getBoundingClientRect();
    return {
      x: clamp((cx - r.left) / (r.width||1) * 100, 0, 100),
      y: clamp((cy - r.top) / (r.height||1) * 100, 0, 100)
    };
  }
  el.addEventListener("pointerdown", (e)=>{
    if(e.pointerType==="mouse" && e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    dragging = true;
    el.classList.add("dragging");
  }, {passive:false});
  el.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    e.preventDefault();
    const p = toPct(e.clientX, e.clientY);
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";
  }, {passive:false});
  function end(e, commit){
    if(!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    if(commit){
      const p = toPct(e.clientX, e.clientY);
      savePos(pos, p.x, p.y);
    }
  }
  el.addEventListener("pointerup", (e)=>end(e,true));
  el.addEventListener("pointercancel", (e)=>end(e,false));
  el.addEventListener("contextmenu", (e)=>e.preventDefault());
}

/* ===== 由名單產生場上球員 ===== */
function buildPlayers(){
  const out = {};
  const roster = Array.isArray(state.team1Roster) ? state.team1Roster : [];
  roster.forEach((p, i)=>{
    if(!p || !p.name) return;
    const key = posMap[String(p.pos||"").trim().toUpperCase()];
    if(!key) return;
    out[key] = {name:String(p.name).trim(), order:String(p.order || i+1)};
  });
  if(!out.P){
    const pn = String(state.team1Pitcher || "").trim();
    if(pn) out.P = {name:pn};
  }
  return out;
}

function fmtName(o){ return o.name; }

function renderBoard(){
  document.getElementById("boardTitle").textContent = state.gameTitle || "";
  const teams = document.getElementById("boardTeams");
  teams.textContent = "";
  const a = document.createElement("span");
  a.textContent = state.team1Name || "";
  const vs = document.createElement("span");
  vs.className = "vs";
  vs.textContent = "vs";
  const b = document.createElement("span");
  b.textContent = state.team2Name || "";
  teams.append(a, vs, b);
}

function render(){
  renderBoard();
  app.querySelectorAll(".player").forEach(n=>n.remove());
  const players = buildPlayers();
  Object.keys(players).forEach(key=>{
    const a = labelAnchors[key];
    const d = document.createElement("div");
    d.className = "player";
    d.textContent = fmtName(players[key]);
    d.dataset.pos = key;
    const saved = loadPos(key);
    if(saved){
      d.style.left = saved.x + "%";
      d.style.top = saved.y + "%";
    }else if(nameOffsets[key]){
      d.style.left = nameOffsets[key].x + "%";
      d.style.top = nameOffsets[key].y + "%";
    }else{
      d.style.left = a.x + "%";
      d.style.top = (a.y + (key==="P" ? NAME_UP : NAME_DOWN)) + "%";
    }
    bindDrag(d, key);
    app.appendChild(d);
  });
}

/* ===== 雙點空白處切換全螢幕 ===== */
function toggleFullscreen(){
  const el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }else{
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if(fn) fn.call(el);
  }
}
let lastTapFS = 0, downPt = null;
document.addEventListener("pointerdown", (e)=>{
  if(e.pointerType==="mouse" && e.button!==0) return;
  downPt = {x:e.clientX, y:e.clientY, target:e.target};
}, {passive:true});
document.addEventListener("pointerup", (e)=>{
  if(!downPt) return;
  const moved = Math.abs(e.clientX-downPt.x) + Math.abs(e.clientY-downPt.y) > 10;
  const onPlayer = downPt.target.classList && downPt.target.classList.contains("player");
  if(!moved && !onPlayer){
    const now = Date.now();
    if(now - lastTapFS < 280){ toggleFullscreen(); lastTapFS = 0; }
    else lastTapFS = now;
  }
  downPt = null;
}, {passive:true});

loadLocal();
render();
initFirebase();
</script>
</body>
</html>
