<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>棒球記分板</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const APP_META = {
  app: "Ggs 怪機絲 EGL全球通棒球記分板 PRO6",
  build: "2025-12-24-PRO6-A01-PITCHER-EDIT-LONGPRESS",
  owner: "Ggs 怪機絲",
  note: "投手列（名單面板紅框列）長按可改投手名字，並與外部投手欄位連動"
};
</script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:transparent !important;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    user-select:none;
    overflow:hidden;
  }

  :root{
    --mlb-navy:#041e42;
    --mlb-red:#d50032;
    --mlb-silver:#c4ced4;
    --mlb-cream:#f5f5f5;

    /* ✅ 對稱核心：兩邊比分框寬度永遠一致 */
    --scoreW: clamp(14vw, 18vh, 22vw);
  }

  /* 直向提示 */
  .orientation-warning{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:transparent;
    color:#fff;
    z-index:9999999;
    text-align:center;
    padding:0 8vw;
    font-size:3vh;
  }
  .orientation-warning-inner{
    border:0.4vh solid rgba(255,255,255,0.5);
    border-radius:2vh;
    padding:3vh 4vw;
    background:radial-gradient(circle at top, #041e42 0%, #000 80%);
    box-shadow:0 0 3vh rgba(0,0,0,0.9);
  }
  .orientation-warning-title{ font-size:4vh; font-weight:900; margin-bottom:1.5vh; }
  .orientation-warning-text{ font-size:2.4vh; opacity:0.85; }

  @media (orientation: portrait){
    .stage{ display:none; }
    .orientation-warning{ display:flex; }
  }
  @media (orientation: landscape){
    .orientation-warning{ display:none; }
  }

  .stage{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    display:flex; align-items:stretch; justify-content:stretch;
    background:#000;
  }

  .bar{
    position:relative;
    width:100vw; height:100vh;
    padding:1vh 0.9vw;
    background:none;
    border-radius:0;
    border:0.22vh solid rgba(196,206,212,0.42);
    box-shadow:inset 0 0 0 0.12vh rgba(255,255,255,0.05);
    display:flex;
    flex-direction:column;
    gap:0.32vh;
    overflow:hidden;
    isolation:isolate;
    animation:none;
  }

  /* ✅ 背景獨立層：雙指調透明，文字永遠 100% */
  .bar::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    border-radius:0;
    background:radial-gradient(circle at top, rgba(10,45,100,0.9) 0%, rgba(2,7,20,0.96) 52%, rgba(0,0,0,1) 100%);
    opacity:var(--barBgOpacity, 1);
    pointer-events:none;
  }
  .bar > *{ position:relative; z-index:1; }

  .roster-toggle{
    position:absolute;
    top:5.7vh;
    right:1vw;
    padding:0.7vh 1.2vw;
    border-radius:999px;
    border:0.28vh solid rgba(196,206,212,0.8);
    background:rgba(0,0,0,0.68);
    color:#fff;
    font-size:1.9vh;
    font-weight:800;
    letter-spacing:0.08em;
    cursor:pointer;
    opacity:0.92;
    z-index:20;
  }

  .main-panel{
    flex:6.0;
    display:flex;
    flex-direction:column;
    gap:0.2vh;
  }

  /* =========================
     ✅ 歸 0：左邊中間
     ========================= */
  .reset-badge{
    position:fixed;
    top:50%;
    left:1.2vw;
    transform:translateY(-50%);
    width:6vh; height:6vh;
    border-radius:50%;
    border:0.3vh solid #fff;
    display:flex;
    align-items:center; justify-content:center;
    font-size:3vh; font-weight:900;
    color:#fff;
    opacity:0.05;
    cursor:pointer;
    z-index:999999;
  }

  /* 比賽名稱 */
  .title-row{
    flex:1.0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .game-title-box{
    padding:0.8vh 3.4vh;
    border-radius:999px;
    background:linear-gradient(135deg, rgba(4,30,66,0.96), rgba(0,0,0,0.95));
    border:0.28vh solid rgba(196,206,212,0.8);
    box-shadow:0 0 1.4vh rgba(0,0,0,0.9);
    cursor:pointer;
    max-width:100%;
  }
  .game-title-text{
    font-size:5.5vh;
    font-weight:900;
    letter-spacing:0.08em;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 0 1.2vh rgba(0,0,0,1), 0 0 1vh rgba(255,255,255,0.75);
  }

  /* ✅ 上排左右對稱 Grid */
  .top-row{
    flex:1.9;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.0vw;
    align-items:stretch;
  }
  .team-column{ min-width:0; display:flex; }

  .team1-block,
  .team2-block{
    width:100%;
    min-width:0;
    padding:0.9vh 1.0vw;
    border-radius:1.2vh;
    background:linear-gradient(180deg, rgba(10,23,48,0.9) 0%, rgba(2,8,20,0.96) 100%);
    border:0.22vh solid rgba(196,206,212,0.72);
    box-shadow:inset 0 0 0 0.08vh rgba(255,255,255,0.06), 0 0 1.2vh rgba(0,0,0,0.9);
    overflow:hidden;

    display:grid;
    align-items:center;
    column-gap:1.4vw;
  }
  .team1-block{ grid-template-columns: 1fr var(--scoreW); }
  .team2-block{ grid-template-columns: var(--scoreW) 1fr; }

  /* ✅ 隊名強制完整顯示：不出現 ...（改用 JS 縮字） */
  .team-name{
    min-width:0;
    font-size:8.8vh;
    font-weight:900;
    letter-spacing:0.04em;
    white-space:nowrap;
    cursor:pointer;
    text-align:center;
    text-shadow:0 0 1.2vh rgba(0,0,0,1), 0 0 1vh rgba(255,255,255,0.7);
    overflow:hidden;
    text-overflow:clip;
    line-height:1.0;
  }

  .score-box{
    width:100%;
    overflow:hidden;
    padding:1.1vh 1.2vh;
    border-radius:1.1vh;
    background:linear-gradient(180deg,#111214 0%, #04070c 100%);
    border:0.28vh solid rgba(196,206,212,0.8);
    box-shadow:inset 0 0 0 0.08vh rgba(255,255,255,0.04), 0 0 1.2vh rgba(0,0,0,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .score-number{
    font-variant-numeric: tabular-nums;
    letter-spacing:-0.04em;
    font-size:clamp(8.5vh, 12vw, 16vh);
    font-weight:900;
    color:#fff;
    line-height:0.95;
    display:block;
    text-shadow:0 0 0.5vh rgba(213,0,50,1), 0 0 1vh rgba(0,0,0,1);
  }

  /* 打擊/投手邊框高亮 */
  .team-batting,
  .score-batting,
  .bp-box.mode-batter{
    border-color:var(--mlb-red) !important;
    box-shadow:0 0 2.6vh rgba(213,0,50,0.9), 0 0 1.6vh rgba(0,0,0,1);
  }
  .team-pitching,
  .score-pitching,
  .bp-box.mode-pitcher{
    border-color:var(--mlb-silver) !important;
    box-shadow:0 0 2.2vh rgba(0,0,0,1), 0 0 1.8vh rgba(4,30,66,0.9);
  }

  /* 下排 */
  .bottom-row{
    flex:1.4;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1.2vw;
    min-width:0;
  }
  .center-block{
    flex:1.9;
    display:flex;
    align-items:center;
    gap:2.2vw;
    min-width:0;
  }
  .inning-box{
    display:flex;
    align-items:center;
    gap:1.4vw;
    padding:0.9vh 2.2vh;
    border-radius:999px;
    background:linear-gradient(135deg,#041e42,#01040a);
    border:0.35vh solid var(--mlb-silver);
    box-shadow:0 0 1.5vh rgba(0,0,0,0.9);
    cursor:pointer;
    flex:0 0 auto;
  }
  .inning-number{ font-size:5.8vh; font-weight:900; }
  .half-indicator{
    width:5.8vh; height:5.8vh;
    border-radius:999px;
    border:0.42vh solid #777;
    background:radial-gradient(circle at top, #041e42 0%, #020813 80%);
    font-size:4vh; font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 1.5vh rgba(0,0,0,1);
    flex:0 0 auto;
  }
  .half-indicator.top{ color:#00d5ff; border-color:#00d5ff; }
  .half-indicator.bot{ color:#ffdc5c; border-color:#ffdc5c; }

  .bases-wrapper{ position:relative; width:16vh; height:13vh; flex:0 0 auto; }
  .base{
    position:absolute;
    width:5.4vh; height:5.4vh;
    border-radius:0.8vh;
    border:0.45vh solid var(--mlb-silver);
    transform:rotate(45deg);
    background:rgba(3,13,30,0.9);
    box-shadow:0 0 2.4vh rgba(0,0,0,1);
    cursor:pointer;
  }
  #base2{ top:0; left:50%; transform:translateX(-50%) rotate(45deg); }
  #base1{ bottom:0; right:0; }
  #base3{ bottom:0; left:0; }
  .base.on{
    background:#ffe600;
    border-color:#ffe600;
    box-shadow:0 0 3vh #ffee55, 0 0 1.6vh rgba(0,0,0,1);
  }

  .pitch-clock{ display:flex; align-items:center; gap:1.2vw; flex:0 0 auto; }
  .game-box{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:1vw;
    padding:0.7vh 2vh;
    border-radius:999px;
    background:linear-gradient(135deg,#04121f,#010308);
    border:0.3vh solid rgba(196,206,212,0.85);
    box-shadow:0 0 1.6vh rgba(0,0,0,0.9), 0 0 1.2vh rgba(4,30,66,0.9);
    font-size:2.6vh;
    white-space:nowrap;
  }
  #gameTimer{
    font-weight:900;
    letter-spacing:0.05em;
    font-size:4.3vh;
    cursor:pointer;
    text-shadow:0 0 1vh rgba(0,0,0,1);
  }
  #gameTimer.running{
    text-shadow:0 0 1.6vh rgba(0,255,153,0.9), 0 0 1vh rgba(0,0,0,1);
  }

  .osb-block{
    flex:1.0;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:1.3vw;
    min-width:0;
  }
  .osb-unit{
    display:flex;
    align-items:center;
    gap:0.7vw;
    padding:0.8vh 1.4vh;
    border-radius:999px;
    background:linear-gradient(135deg,#04121f,#010308);
    border:0.35vh solid rgba(196,206,212,0.95);
    box-shadow:0 0 1.2vh rgba(0,0,0,0.9);
    cursor:pointer;
    max-width:100%;
  }
  .osb-letter{
    font-size:clamp(4.8vh, 5.4vh, 6.2vh);
    font-weight:900;
    text-shadow:0 0 2.2vh rgba(0,0,0,1);
    flex:0 0 auto;
  }
  .osb-lights{ display:flex; gap:0.8vw; min-width:0; }

  .light{
    width:clamp(2.6vh, 3.0vh, 3.4vh);
    height:clamp(2.6vh, 3.0vh, 3.4vh);
    border-radius:50%;
    background:#222b3b;
    border:0.35vh solid #44546e;
    box-shadow:0 0 2.2vh #000;
    flex:0 0 auto;
  }

  /* ===============================
     ✅ BSO 燈號配色（成品）
     B = 綠色 / S = 黃色 / O = 紅色
     =============================== */
  .light.on-ball{
    background:#22c55e;
    border-color:#4ade80;
    box-shadow:0 0 3vh #4ade80;
  }
  .light.on-strike{
    background:#facc15;
    border-color:#fde047;
    box-shadow:0 0 3vh #fde047;
  }
  .light.on-out{
    background:#ef4444;
    border-color:#f87171;
    box-shadow:0 0 3vh #f87171;
  }

  /* ===============================
     ✅ O 出局（兩出局）轉播閃爍效果
     觸發條件：#outsArea.out-two
     =============================== */
  @keyframes outBlink {
    0%   { filter:brightness(1.0); transform:scale(1.00); opacity:0.75; }
    100% { filter:brightness(1.55); transform:scale(1.06); opacity:1.00; }
  }
  @keyframes outPulse {
    0%   { transform:scale(1.00); }
    50%  { transform:scale(1.16); }
    100% { transform:scale(1.00); }
  }
  #outsArea.out-two .light.on-out{
    animation: outBlink 0.20s alternate infinite;
    box-shadow: 0 0 4vh rgba(255,0,0,0.85);
  }
  #outsArea.out-two .light.on-out:last-child{
    animation: outBlink 0.16s alternate infinite, outPulse 0.42s ease-in-out infinite;
  }

  /* BP */
  .bp-row{
    flex:0.9;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:1.8vw;
    padding:0 1.8vw;
  }
  .bp-box{
    flex:1;
    min-width:0;
    max-width:40vw;
    min-height:12.2vh;
    padding:0.8vh 1.1vw;
    border-radius:999px;
    background:linear-gradient(135deg,#04121f,#010308);
    border:0.28vh solid rgba(196,206,212,0.9);
    box-shadow:0 0 1.1vh rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    gap:0.8vw;
    cursor:pointer;
  }
  .bp-main{
    display:flex;
    flex:1;
    align-items:center;
    gap:0.8vw;
    justify-content:center;
  }
  .bp-label{
    font-size:2.3vh;
    font-weight:900;
    letter-spacing:0.14em;
    color:var(--mlb-silver);
    white-space:nowrap;
  }
  .bp-name{
    font-size:5.6vh;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
    width:100%;
  }
  .bp-arrow{
    width:4.4vh; height:4.4vh;
    border-radius:50%;
    border:0.3vh solid rgba(196,206,212,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:3vh;
    font-weight:900;
    user-select:none;
  }
  .bp-box.mode-batter .bp-arrow{ display:flex; }

  /* roster panel */
  .roster-panel{
    position:absolute;
    top:14vh; bottom:12vh;
    width:31vw;
    padding:1.2vh 1.2vw;
    background:linear-gradient(180deg, rgba(5,9,17,0.98) 0%, rgba(2,4,10,0.98) 100%);
    border-radius:1.4vh;
    border:0.22vh solid rgba(196,206,212,0.82);
    box-shadow:0 0 1.8vh rgba(0,0,0,0.85);
    display:none;
    flex-direction:column;
    z-index:50;
  }
  .roster-panel.show{ display:flex; }
  .roster-left{ left:3vw; }
  .roster-right{ right:3vw; }

  .roster-header{ display:flex; flex-direction:column; margin-bottom:1vh; }
  .roster-team{
    font-size:3.4vh;
    font-weight:900;
    letter-spacing:0.08em;
    text-shadow:0 0 1vh rgba(0,0,0,1);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .roster-sub{ font-size:1.6vh; opacity:0.8; letter-spacing:0.16em; }

  .roster-pitcher-box{
    display:flex;
    align-items:center;
    gap:0.9vw;
    padding:0.6vh 0.9vh;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(16,31,59,0.9), rgba(3,7,15,0.96));
    border:0.2vh solid rgba(213,0,50,0.9);
    margin-bottom:0.9vh;
    flex-shrink:0;
    cursor:pointer;
  }
  .roster-pitcher-label{ font-size:1.7vh; font-weight:700; color:var(--mlb-silver); }
  .roster-pitcher-name{ font-size:2.2vh; font-weight:900; }

  .roster-head-row,.roster-row{
    display:grid;
    grid-template-columns:0.9fr 2.8fr 1.3fr;
    align-items:center;
    gap:0.5vw;
  }
  .roster-head-row{
    font-size:1.5vh;
    opacity:0.85;
    border-bottom:0.12vh solid rgba(196,206,212,0.45);
    padding:0.2vh 0 0.4vh 0;
    margin-bottom:0.3vh;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .roster-list{
    flex:1;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:0.22vh;
  }
  .roster-row{
    font-size:2.2vh;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0.12vh 0;
    border-bottom:0.08vh solid rgba(196,206,212,0.18);
  }
  .roster-col-order{ text-align:center; font-weight:800; }
  .roster-col-pos{ text-align:center; font-weight:700; }
  .roster-col-name{ text-align:left; }

  /* Flash */
  .flash-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999998;
    pointer-events:none;
  }
  .flash-text{
    font-size:30vh;
    font-weight:900;
    padding:4vh 8vw;
    border-radius:2vh;
    text-align:center;
    line-height:1;
    white-space:pre-line; /* ✅ 允許 \n 第二行 */
  }

  .flash-greenwhite{ background:radial-gradient(circle at center, rgba(180,255,200,0.28), rgba(0,20,0,0.96)); }
  .flash-greenwhite .flash-text{
    color:#e9ffe9;
    border:1.2vh solid #66ff66;
    text-shadow:0 0 3vh #66ff66, 0 0 5vh #ffffff;
    animation:flashGreenWhite 0.22s alternate infinite;
  }
  .flash-rgwhite{ background:radial-gradient(circle at center, rgba(255,255,255,0.25), rgba(0,0,0,0.96)); }
  .flash-rgwhite .flash-text{
    color:#ffffff;
    border:1.2vh solid #ff3366;
    text-shadow:0 0 2.5vh #ff3366, 0 0 4vh #66ff66, 0 0 5vh #ffffff;
    animation:flashRGWhite 0.22s alternate infinite;
  }
  .flash-bluewhite{ background:radial-gradient(circle at center, rgba(160,200,255,0.24), rgba(0,0,0,0.96)); }
  .flash-bluewhite .flash-text{
    color:#e6f3ff;
    border:1.2vh solid #66aaff;
    text-shadow:0 0 3vh #66aaff, 0 0 5vh #ffffff;
    animation:flashBlueWhite 0.18s alternate infinite;
  }
  .flash-blackwhite{ background:radial-gradient(circle at center, rgba(255,255,255,0.10), rgba(0,0,0,0.96)); }
  .flash-blackwhite .flash-text{
    color:#ffffff;
    border:1.2vh solid #ffffff;
    text-shadow:0 0 3vh #000000, 0 0 5vh #ffffff;
    animation:flashBlackWhite 0.18s alternate infinite;
  }
  .flash-gan .flash-text{
    color:#ff3333;
    border:1.2vh solid #000000;
    text-shadow:0 0 3vh #000, 0 0 2vh #ff0000;
  }

  @keyframes flashGreenWhite{
    0%{ text-shadow:0 0 2vh #33ff66,0 0 3vh #fff; transform:scale(1.03); }
    100%{ text-shadow:0 0 4vh #fff,0 0 6vh #33ff99; transform:scale(1.10); }
  }
  @keyframes flashRGWhite{
    0%{ text-shadow:0 0 2vh #ff3366,0 0 3vh #66ff66,0 0 4vh #fff; transform:scale(1.03); }
    100%{ text-shadow:0 0 4vh #fff,0 0 6vh #ff3366,0 0 6vh #66ff66; transform:scale(1.10); }
  }
  @keyframes flashBlueWhite{
    0%{ text-shadow:0 0 2vh #3377ff,0 0 3vh #ffffff; transform:scale(1.03); }
    100%{ text-shadow:0 0 4vh #ffffff,0 0 6vh #66aaff; transform:scale(1.08); }
  }
  @keyframes flashBlackWhite{
    0%{ text-shadow:0 0 2vh #000000,0 0 3vh #ffffff; transform:scale(1.03); }
    100%{ text-shadow:0 0 4vh #ffffff,0 0 6vh #000000; transform:scale(1.08); }
  }

  /* ===============================
     ✅ B/S/O 動畫字幕（顏色與燈一致）
     =============================== */
  .flash-ball{
    background:radial-gradient(circle at center, rgba(34,197,94,0.22), rgba(0,0,0,0.96));
  }
  .flash-ball .flash-text{
    color:#eaffef;
    border:1.2vh solid #22c55e;
    text-shadow:0 0 3vh #22c55e, 0 0 5vh #ffffff;
    animation: bsoPop 0.18s ease-out both, bsoPulse 0.55s ease-in-out infinite;
  }

  .flash-strike{
    background:radial-gradient(circle at center, rgba(250,204,21,0.20), rgba(0,0,0,0.96));
  }
  .flash-strike .flash-text{
    color:#fff7c2;
    border:1.2vh solid #facc15;
    text-shadow:0 0 3vh #facc15, 0 0 5vh #ffffff;
    animation: bsoPop 0.18s ease-out both, bsoPulse 0.55s ease-in-out infinite;
  }

  .flash-out{
    background:radial-gradient(circle at center, rgba(239,68,68,0.24), rgba(0,0,0,0.96));
  }
  .flash-out .flash-text{
    color:#ffffff;
    border:1.2vh solid #ef4444;
    letter-spacing:0.18em;
    text-shadow:0 0 3vh #ef4444, 0 0 5vh #ffffff, 0 0 8vh rgba(255,0,0,0.85);
    animation: outShake 0.18s linear infinite, outPulseBig 0.42s ease-in-out infinite;
  }

  @keyframes bsoPop{
    0%{ transform:scale(0.92); opacity:0.0; }
    100%{ transform:scale(1.04); opacity:1.0; }
  }
  @keyframes bsoPulse{
    0%{ filter:brightness(1.0); transform:scale(1.02); }
    50%{ filter:brightness(1.35); transform:scale(1.08); }
    100%{ filter:brightness(1.0); transform:scale(1.02); }
  }
  @keyframes outShake{
    0%{ transform:translate(0,0) scale(1.02); }
    25%{ transform:translate(-0.6vh,0.4vh) scale(1.05); }
    50%{ transform:translate(0.6vh,-0.4vh) scale(1.08); }
    75%{ transform:translate(-0.4vh,-0.6vh) scale(1.05); }
    100%{ transform:translate(0,0) scale(1.02); }
  }
  @keyframes outPulseBig{
    0%{ filter:brightness(1.0); }
    50%{ filter:brightness(1.45); }
    100%{ filter:brightness(1.0); }
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999992;

  .overlay.show{ display:flex; animation:overlayIn 0.22s ease-out; }

  .overlay-inner{

<script>
const STORAGE_KEY = "scoreboard_16x9_worldcup_zh_v1";

let state = {

let gameSeconds = 0;
let gameRunning = false;

let showRoster1 = false;
let showRoster2 = false;

/* ✅ 記憶：上一個 B/S/O（避免重複跳字幕） */
let __lastBalls = 0;
let __lastStrikes = 0;
let __lastOuts = 0;

/* ===== 隊名字體自動縮放（強制不出 ...）===== */
function fitOneTeamName(el, baseVh=10, minVh=5.2){
  if(!el) return;
  const parent = el.parentElement;
  if(!parent) return;

  el.style.fontSize = baseVh + "vh";
  const maxLoops = 40;
  let loops = 0;

  const vhPx = window.innerHeight / 100;
  let cur = baseVh * vhPx;
  const minPx = minVh * vhPx;

  void el.offsetWidth;

  while(el.scrollWidth > el.clientWidth && cur > minPx && loops < maxLoops){
    cur *= 0.95;
    el.style.fontSize = cur + "px";
    loops++;
  }
}
function fitTeamNames(){
  fitOneTeamName(document.getElementById("team1Name"), 10, 5.2);
  fitOneTeamName(document.getElementById("team2Name"), 10, 5.2);
}

/* ===== 全螢幕（雙擊螢幕）===== */
function isAnyOverlayOpen(){
  const ids=["textOverlay"];
  return ids.some(id=>{
    const el=document.getElementById(id);
    return el && el.classList.contains("show");
  });
}
function requestFullscreenSafe(target){
  try{
    const el = target || document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(fn) fn.call(el);
  }catch(e){}
}
function bindDoubleTapFullscreen(){
  const root = document.getElementById("mainBar") || document.body;

  document.addEventListener("dblclick",()=>{
    if(isAnyOverlayOpen()) return;
    requestFullscreenSafe(document.documentElement);
  }, {passive:true});

  let lastTap=0;
  root.addEventListener("touchend",(e)=>{
    if(isAnyOverlayOpen()) return;
    if(e.changedTouches && e.changedTouches.length>=2) return;
    const now=Date.now();
    if(now-lastTap < 280){
      lastTap=0;
      requestFullscreenSafe(document.documentElement);
      return;
    }
    lastTap=now;
  }, {passive:true});
}

/* ===== 背景透明度（雙指上下滑動） ===== */
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function setBarBgOpacity(v){
  const bar = document.getElementById("mainBar");
  if (!bar) return;
  const val = clamp(v, 0, 1);
  bar.style.setProperty("--barBgOpacity", val.toFixed(3));
  try{ localStorage.setItem("barBgOpacity", String(val)); }catch(e){}
}
function loadBarBgOpacity(){
  try{
    const v = parseFloat(localStorage.getItem("barBgOpacity"));
    if (!isNaN(v)) setBarBgOpacity(v);
  }catch(e){}
}
function bindBgOpacityGesture(){
  const bar = document.getElementById("mainBar");
  if (!bar) return;

  loadBarBgOpacity();

  let active=false, startY=0, startOpacity=1;
  const getAvgY = (t1,t2)=>(t1.clientY+t2.clientY)/2;

  bar.addEventListener("touchstart",(e)=>{
    if(e.touches && e.touches.length===2){
      active=true;
      startY=getAvgY(e.touches[0],e.touches[1]);
      const cur=parseFloat(getComputedStyle(bar).getPropertyValue("--barBgOpacity"))||1;
      startOpacity=cur;
    }
  },{passive:true});

  bar.addEventListener("touchmove",(e)=>{
    if(!active) return;
    if(!e.touches || e.touches.length!==2) return;
    e.preventDefault();
    const y=getAvgY(e.touches[0],e.touches[1]);
    const dy=y-startY;
    const next=startOpacity-(dy/400);
    setBarBgOpacity(next);
  },{passive:false});

  const end=()=>{ active=false; };
  bar.addEventListener("touchend",end,{passive:true});
  bar.addEventListener("touchcancel",end,{passive:true});
}

/* ===== TextOverlay ===== */
let __textCb=null;
function openTextOverlay(title,value,cb){
  const ov=document.getElementById("textOverlay");
  const t=document.getElementById("textTitle");
  const a=document.getElementById("textArea");
  if(!ov||!t||!a) return;
  __textCb=cb||null;
  t.textContent=title||"文字輸入";
  a.value=(value==null)?"":String(value);
  ov.classList.add("show");
  requestAnimationFrame(()=>{ a.focus(); try{a.setSelectionRange(a.value.length,a.value.length);}catch(e){} });
}
function closeTextOverlay(){
  const ov=document.getElementById("textOverlay");
  if(!ov) return;
  ov.classList.remove("show");
  __textCb=null;
}
function saveTextOverlay(){
  const a=document.getElementById("textArea");
  const val=a?a.value:"";
  const cb=__textCb;
  closeTextOverlay();
  if(cb) cb(val);
}
(function(){
  const ov=document.getElementById("textOverlay");
  const closeBtn=document.getElementById("textClose");
  const cancelBtn=document.getElementById("textCancel");
  const saveBtn=document.getElementById("textSave");
  if(closeBtn) closeBtn.addEventListener("click",closeTextOverlay);
  if(cancelBtn) cancelBtn.addEventListener("click",closeTextOverlay);
  if(saveBtn) saveBtn.addEventListener("click",saveTextOverlay);
  if(ov) ov.addEventListener("click",(e)=>{ if(e.target===ov) closeTextOverlay(); });
  const a=document.getElementById("textArea");
  if(a){
    a.addEventListener("keydown",(e)=>{
      if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); saveTextOverlay(); }
      if(e.key==="Escape"){ e.preventDefault(); closeTextOverlay(); }
    });
  }
})();

/* ===== Flash ===== */
let flashTimer=null;
function clearFlashClasses(overlay){
  overlay.classList.remove(
    "flash-greenwhite","flash-rgwhite","flash-bluewhite","flash-blackwhite","flash-gan",
    "flash-ball","flash-strike","flash-out"
  );
}
function showFlash(text,mode,durationMs){
  const overlay=document.getElementById("flashOverlay");
  const flashText=document.getElementById("flashText");
  if(!overlay||!flashText) return;
  clearFlashClasses(overlay);
  if(mode) overlay.classList.add(mode);
  flashText.textContent=text;
  overlay.removeAttribute("data-tag");
  overlay.style.display="flex";
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{ overlay.style.display="none"; overlay.removeAttribute("data-tag"); }, durationMs);
}
function toggleFlashSticky(tag,text,mode){
  const overlay=document.getElementById("flashOverlay");
  const flashText=document.getElementById("flashText");
  if(!overlay||!flashText) return;
  const currentTag=overlay.getAttribute("data-tag");
  const isVisible=overlay.style.display==="flex";
  if(isVisible && currentTag===tag){
    overlay.style.display="none";
    overlay.removeAttribute("data-tag");
    if(flashTimer){ clearTimeout(flashTimer); flashTimer=null; }
    return;
  }
  clearFlashClasses(overlay);
  if(mode) overlay.classList.add(mode);
  flashText.textContent=text;
  overlay.setAttribute("data-tag",tag);
  overlay.style.display="flex";
  if(flashTimer){ clearTimeout(flashTimer); flashTimer=null; }
}

/* ===== State ===== */
function loadState(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved) state=Object.assign(state, JSON.parse(saved));
  }catch(e){}
  normalizeSharedRoster();
}
function normalizeSharedRoster(){
  if(!state.bp1Mode) state.bp1Mode="P";
  if(!state.bp2Mode) state.bp2Mode="P";
  if(typeof state.bp1Index!=="number") state.bp1Index=0;
  if(typeof state.bp2Index!=="number") state.bp2Index=0;
  const sharedRoster=Array.isArray(state.team1Roster)&&state.team1Roster.length
    ?state.team1Roster
    :(state.team2Roster||[]);

function formatGameTime(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

}

  if(!gameRunning) return;

  if(gameTimerId){ clearInterval(gameTimerId); gameTimerId=null; }
}

/* ===== Gestures ===== */
function addLongPress(el,onPress){
  if(!el) return;
  let pressTimer=null;
  const start=()=>{
    if(pressTimer) return;
    pressTimer=setTimeout(()=>{ pressTimer=null; onPress&&onPress(); },550);
  };
  const cancel=()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  };
  ["mousedown","touchstart"].forEach(e=>el.addEventListener(e,start,{passive:true}));
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(e=>el.addEventListener(e,cancel,{passive:true}));
}
function addTapHandler(el,onSingle,onDouble){
  if(!el) return;
  let timer=null;
  el.addEventListener("click",()=>{
    if(timer){ clearTimeout(timer); timer=null; onDouble&&onDouble(); }
    else{ timer=setTimeout(()=>{ timer=null; onSingle&&onSingle(); },220); }
  });
}
function addSwipeHandler(el,onSwipeLeft,onSwipeRight){
  if(!el) return;
  let startX=0,startY=0;
  el.addEventListener("touchstart",(e)=>{
    const t=e.touches[0];
    startX=t.clientX; startY=t.clientY;
  },{passive:true});
  el.addEventListener("touchend",(e)=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0) onSwipeLeft&&onSwipeLeft();
      else onSwipeRight&&onSwipeRight();
    }
  },{passive:true});
}

let rosterEditorTeamNo=1;
let rosterEditorFields=[];
let rosterEditorPositionFields=[];
function closeRosterEditor(){
  const overlay=document.getElementById("rosterEditorOverlay");
  if(overlay) overlay.classList.remove("show");

  rosterEditorPositionFields=[];
}
function openTeamRosterEditor(){
  const overlay=document.getElementById("rosterEditorOverlay");
  const title=document.getElementById("rosterEditorTitle");
  const body=document.getElementById("rosterEditorBody");
  if(!overlay||!title||!body) return;

  rosterEditorTeamNo=1;
  rosterEditorFields=[];
  const roster=state.team1Roster||[];
  const gameRoster=state.gameRoster||[];
  const batterFields=[];
  rosterEditorPositionFields=[];
  const positionOptions=["P","C","1B","2B","3B","SS","LF","CF","RF","DH"];
  title.textContent="共用球員名單與守備位置";
  body.innerHTML="";

  function fillOptions(select,selectedIndex,excludeIndexes){
    select.innerHTML="";
    gameRoster.forEach((player,index)=>{
      if(excludeIndexes.has(index) && index!==selectedIndex) return;
      const option=document.createElement("option");
      option.value=String(index);
      option.textContent=`${player.number||player.order||""},${player.name||""}`;
      if(index===selectedIndex) option.selected=true;
      select.appendChild(option);
    });
  }
  function refreshBatterOptions(){
    const selectedIndexes=new Set(batterFields.map(select=>Number(select.value)));
    batterFields.forEach(select=>fillOptions(select,Number(select.value),selectedIndexes));
  }
  function refreshPositionOptions(){
    rosterEditorPositionFields.forEach(select=>{
      const currentValue=select.value;
      select.innerHTML="";
      positionOptions.forEach(position=>{
        const option=document.createElement("option");
        option.value=position;
        option.textContent=position;
        option.selected=position===currentValue;
        select.appendChild(option);
      });
      select.dataset.previousValue=currentValue;
    });
  }
  function swapPositionSelection(select){
    const previousValue=select.dataset.previousValue;
    const selectedValue=select.value;
    const otherSelect=rosterEditorPositionFields.find(other=>other!==select&&other.value===selectedValue);
    if(otherSelect&&previousValue){
      otherSelect.value=previousValue;
      otherSelect.dataset.previousValue=previousValue;
    }
    select.dataset.previousValue=selectedValue;
  }
  function addField(labelText,currentName,isBatter,index,currentPosition){
    const row=document.createElement("div");
    row.className=`roster-editor-row${isBatter?"":" pitcher"}`;
    const label=document.createElement("label");
    label.textContent=labelText;
    const select=document.createElement("select");
    const usedPositions=new Set(rosterEditorPositionFields.map(positionSelect=>positionSelect.value));
    const selectedPosition=isBatter&&currentPosition&&!usedPositions.has(currentPosition)
      ?currentPosition
      :(isBatter?positionOptions.find(position=>!usedPositions.has(position)):"");
    const selectedIndex=gameRoster.findIndex(player=>player.name===currentName);
    fillOptions(select,selectedIndex>=0?selectedIndex:(isBatter?index:0),new Set());
    if(!gameRoster.length){
      const option=document.createElement("option");
      option.textContent="請先設定出賽名單";
      option.value="";
      select.appendChild(option);
    }
    row.appendChild(label);
    row.appendChild(select);
    if(isBatter){
      const positionSelect=document.createElement("select");
      positionOptions.forEach(position=>{
        const option=document.createElement("option");
        option.value=position;
        option.textContent=position;
        option.selected=position===selectedPosition;
        positionSelect.appendChild(option);
      });
      row.appendChild(positionSelect);
      rosterEditorPositionFields.push(positionSelect);
      positionSelect.addEventListener("change",()=>{
        swapPositionSelection(positionSelect);
        refreshPositionOptions();
      });
    }
    body.appendChild(row);
    rosterEditorFields.push(select);
    if(isBatter){
      batterFields.push(select);
      select.addEventListener("change",refreshBatterOptions);
    }
  }

  roster.forEach((player,index)=>addField(`${player.order||index+1}棒`, player.name||"",true,index+1,player.pos||positionOptions[index+1]||""));
  refreshBatterOptions();
  refreshPositionOptions();
  overlay.classList.add("show");
}

    if(selected) player.name=selected.name||"";

  document.getElementById("base3").addEventListener("click",()=>{ state.bases^=4; saveState(); renderAll(); });

  document.getElementById("ballsArea").addEventListener("click",()=>{ state.balls=(state.balls<3)?state.balls+1:0; saveState(); renderAll(); });
  document.getElementById("strikesArea").addEventListener("click",()=>{ state.strikes=(state.strikes<2)?state.strikes+1:0; saveState(); renderAll(); });
  document.getElementById("outsArea").addEventListener("click",()=>{
    state.outs=(state.outs<2)?state.outs+1:0;
    state.balls=0;
    state.strikes=0;
    saveState();
    renderAll();
  });

  const gameTimerEl=document.getElementById("gameTimer");
  addTapHandler(gameTimerEl,
    ()=>{ gameRunning?stopGameTimer():startGameTimer(); },
    ()=>{ resetGameTimer(); stopGameTimer(); }
  );

  const roster1=document.getElementById("team1RosterPanel");
  const roster2=document.getElementById("team2RosterPanel");
  if(roster1){ addLongPress(roster1,()=>editRoster(1)); addTapHandler(roster1,null,()=>toggleRoster(1)); }
  if(roster2){ addLongPress(roster2,()=>editRoster(2)); addTapHandler(roster2,null,()=>toggleRoster(2)); }

  const bp1Box=document.getElementById("bp1Box");
  const bp2Box=document.getElementById("bp2Box");
  addSwipeHandler(bp2Box,()=>{ moveBatter(2,+1); },()=>{ moveBatter(2,-1); });

  const bp1ArrowUp=document.getElementById("bp1ArrowUp");
  const bp1ArrowDown=document.getElementById("bp1ArrowDown");
  const bp2ArrowUp=document.getElementById("bp2ArrowUp");
  const bp2ArrowDown=document.getElementById("bp2ArrowDown");
  if(bp2ArrowUp) bp2ArrowUp.addEventListener("click",(e)=>{ e.stopPropagation(); moveBatter(2,-1); });
  if(bp2ArrowDown) bp2ArrowDown.addEventListener("click",(e)=>{ e.stopPropagation(); moveBatter(2,+1); });

  window.addEventListener("resize", ()=>{
    fitTeamNames();
  });
}

function init(){
  loadState();

  /* ✅ 初始化 last 值：避免剛進頁面就因為 localStorage 的狀態直接跳字幕 */
  __lastBalls = state.balls;
  __lastStrikes = state.strikes;
  __lastOuts = state.outs;

  renderAll();
  bindEvents();

  bindBgOpacityGesture();
  startSharedSync();

  if(!getComputedStyle(document.getElementById("mainBar")).getPropertyValue("--barBgOpacity").trim()){
    setBarBgOpacity(1);
  }

  fitTeamNames();
  requestAnimationFrame(()=>fitTeamNames());

  bindDoubleTapFullscreen();
}
init();
</script>
</body>
</html>
